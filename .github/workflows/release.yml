name: Release

# Push a tag to publish a release:
#
#   git tag -a v1.0.0 -m "v1.0.0" && git push origin v1.0.0
#
# The workflow builds the universal Release app, signs it with the Developer
# ID certificate, has Apple notarize it, packs it into a DMG that is signed and
# notarized too, attaches the DMG to a new GitHub release, stores the version
# on the default branch, and points the Homebrew cask in fballiano/homebrew-tap
# at the new release.
#
# Run it by hand (Actions -> Release -> Run workflow) with "dry run" on to
# sign and notarize without a release: the DMG stays on the run as an
# artifact. With "dry run" off, a manual run publishes the version you type.
#
# What it needs, in the repository settings (fballiano/shellyard has
# Scripts/setup-signing.sh, which sets them for several repositories at once):
#
#   variable  APPLE_TEAM_ID                the ten-character Team ID
#   secret    DEVELOPER_ID_P12_BASE64      the Developer ID Application
#                                          certificate and its key, .p12,
#                                          in base64
#   secret    DEVELOPER_ID_P12_PASSWORD    the password of that .p12
#   secret    NOTARY_KEY_P8_BASE64         an App Store Connect API key,
#                                          .p8, in base64
#   secret    NOTARY_KEY_ID                the ID of that key
#   secret    NOTARY_ISSUER_ID             the issuer ID of that key
#   secret    TAP_DEPLOY_KEY               a deploy key with write access to
#                                          fballiano/homebrew-tap

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, without the leading v, for example 1.0.0"
        required: true
      dry_run:
        description: "Dry run: sign and notarize, keep the DMG as an artifact, publish nothing"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      APP: build/Build/Products/Release/Clipyard.app
      PUBLISH: ${{ github.event_name == 'push' || !inputs.dry_run }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Select Xcode
        run: |
          sudo xcode-select -switch /Applications/Xcode.app
          xcodebuild -version
          swift --version

      - name: Read the version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version $version"

      - name: Run the tests
        run: make test

      # A keychain of its own, for this run only. The certificate never
      # touches the disk outside the runner's temporary folder.
      - name: Import the Developer ID certificate and the notary key
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY_P8_BASE64: ${{ secrets.NOTARY_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$TEAM_ID" ] || [ -z "$P12_BASE64" ] || [ -z "$NOTARY_KEY_P8_BASE64" ]; then
            echo "::error::The signing variable or secrets are not set. See the comment at the top of this file."
            exit 1
          fi
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" \
            -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/developer-id.p12"
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          # The current list, word by word: the paths hold no spaces.
          read -r -a existing <<< "$(security list-keychains -d user | tr -d '"' | xargs)"
          security list-keychains -d user -s "$KEYCHAIN" "${existing[@]}"
          security find-identity -v -p codesigning "$KEYCHAIN"

          NOTARY_KEY_PATH="$RUNNER_TEMP/notary-key.p8"
          echo "$NOTARY_KEY_P8_BASE64" | base64 --decode > "$NOTARY_KEY_PATH"
          echo "NOTARY_KEY_PATH=$NOTARY_KEY_PATH" >> "$GITHUB_ENV"

      # The settings reach xcodebuild through XCODE_FLAGS. Notarization
      # refuses an executable without the hardened runtime or a secure
      # timestamp, and Xcode's base entitlements would add get-task-allow,
      # which it refuses too.
      - name: Build and sign the app
        run: |
          make build VERSION="${{ steps.version.outputs.version }}" \
                     BUILD_NUMBER="${{ github.run_number }}" \
                     XCODE_FLAGS="CODE_SIGN_STYLE=Manual \
                                  CODE_SIGN_IDENTITY='Developer ID Application' \
                                  DEVELOPMENT_TEAM=$TEAM_ID \
                                  OTHER_CODE_SIGN_FLAGS='--timestamp --keychain $KEYCHAIN' \
                                  ENABLE_HARDENED_RUNTIME=YES \
                                  CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO"

      - name: Check the signature of the app
        run: |
          set -euo pipefail
          codesign --verify --deep --strict --verbose=2 "$APP"
          for binary in "$APP"/Contents/MacOS/*; do
            echo "== $binary"
            lipo -archs "$binary"
            details="$(codesign -dvv "$binary" 2>&1)"
            echo "$details" | grep -E "Authority=Developer ID Application|TeamIdentifier|flags|Timestamp"
            grep -q "TeamIdentifier=$TEAM_ID" <<< "$details" \
              || { echo "::error::$binary is not signed by team $TEAM_ID"; exit 1; }
            grep -q "(runtime)" <<< "$details" \
              || { echo "::error::$binary has no hardened runtime"; exit 1; }
            grep -q "^Timestamp=" <<< "$details" \
              || { echo "::error::$binary has no secure timestamp"; exit 1; }
            if grep -q "get-task-allow" \
                 <<< "$(codesign -d --entitlements :- "$binary" 2>/dev/null)"; then
              echo "::error::$binary carries get-task-allow"; exit 1
            fi
          done

      # The app gets a ticket of its own before it goes into the DMG, so it
      # opens without a network check once it is copied out.
      - name: Notarize the app
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: Tools/notarize.sh "$APP"

      - name: Pack, sign and notarize the disk image
        id: dmg
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          make package
          path=$(ls dist/*.dmg)
          codesign --sign "Developer ID Application" --timestamp --keychain "$KEYCHAIN" "$path"
          Tools/notarize.sh "$path"
          echo "path=$path" >> "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 "$path" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Check the disk image
        run: |
          set -euo pipefail
          path="${{ steps.dmg.outputs.path }}"
          spctl --assess --type open --context context:primary-signature --verbose=4 "$path"
          # The app must be a universal binary, signed, and accepted by
          # Gatekeeper as notarized.
          hdiutil attach "$path" -nobrowse -mountpoint /tmp/clipyard-dmg
          lipo -archs /tmp/clipyard-dmg/Clipyard.app/Contents/MacOS/Clipyard
          codesign --verify --strict --verbose /tmp/clipyard-dmg/Clipyard.app
          xcrun stapler validate /tmp/clipyard-dmg/Clipyard.app
          spctl --assess --type execute --verbose=4 /tmp/clipyard-dmg/Clipyard.app
          hdiutil detach /tmp/clipyard-dmg

      - name: Keep the dry-run disk image
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Clipyard-${{ steps.version.outputs.version }}-dry-run
          path: ${{ steps.dmg.outputs.path }}

      - name: Write the release notes
        if: env.PUBLISH == 'true'
        run: |
          cat > /tmp/notes.md <<'NOTES'
          ## Install

          1. Download the DMG below.
          2. Open it and drag **Clipyard** into **Applications**.

          The app is signed with an Apple Developer ID and notarized by Apple.
          It has no dock icon. It appears in the menu bar.

          ## Requirements

          macOS 15.0 or later. Apple silicon and Intel (universal binary).

          NOTES
          printf 'SHA-256 of the DMG: `%s`\n' "${{ steps.dmg.outputs.sha256 }}" >> /tmp/notes.md

      - name: Publish the release
        if: env.PUBLISH == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.version.outputs.version }}" \
            "${{ steps.dmg.outputs.path }}" \
            --title "Clipyard ${{ steps.version.outputs.version }}" \
            --notes-file /tmp/notes.md \
            --generate-notes \
            --target "${{ github.sha }}"

      # A local build reads the version from project.yml and from the project
      # file. This step writes the version of the release into both and pushes
      # the change to the default branch. It runs after the release is public.
      - name: Update the stored version
        if: env.PUBLISH == 'true'
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          # A tag build checks out a detached HEAD, so move to the branch first.
          git fetch --depth 1 origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"
          sed -i '' \
            -e "s|^    MARKETING_VERSION: \".*\"$|    MARKETING_VERSION: \"$version\"|" \
            project.yml
          sed -i '' \
            -e "s|MARKETING_VERSION = .*;|MARKETING_VERSION = $version;|" \
            ClipboardController.xcodeproj/project.pbxproj
          files="project.yml ClipboardController.xcodeproj/project.pbxproj"
          if git diff --quiet -- $files; then
            echo "The repository already holds version $version."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update the version to $version" -- $files
          git push origin "HEAD:$BRANCH"

      # The cask lives in fballiano/homebrew-tap. The secret TAP_DEPLOY_KEY is
      # a deploy key with write access to that repository only.
      - name: Check out the Homebrew tap
        if: env.PUBLISH == 'true'
        uses: actions/checkout@v7
        with:
          repository: fballiano/homebrew-tap
          ssh-key: ${{ secrets.TAP_DEPLOY_KEY }}
          path: homebrew-tap

      - name: Point the cask at the release
        if: env.PUBLISH == 'true'
        working-directory: homebrew-tap
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          sha256="${{ steps.dmg.outputs.sha256 }}"
          sed -i '' \
            -e "s|^  version \".*\"$|  version \"$version\"|" \
            -e "s|^  sha256 \".*\"$|  sha256 \"$sha256\"|" \
            Casks/clipyard.rb
          if git diff --quiet; then
            echo "The tap already holds version $version."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Point clipyard at $version" -- Casks/clipyard.rb
          # Another application can push to the tap at the same time.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then exit 0; fi
            git pull --rebase origin main
          done
          exit 1

      - name: Remove the signing keychain and the notary key
        if: always()
        run: |
          if [ -n "${KEYCHAIN:-}" ]; then
            security delete-keychain "$KEYCHAIN" 2>/dev/null || true
          fi
          rm -f "${NOTARY_KEY_PATH:-/nonexistent}"
